<!doctype html>
<!-- Minimal stand-in for a Storybook preview iframe: same body classes,
     same root elements, same channel events. Used by test/e2e.test.js. -->
<html>
<head><meta charset="utf-8"><title>fake storybook</title></head>
<body class="sb-show-preparing-docs">
  <div class="sb-errordisplay sb-wrapper"><div id="error-message"></div></div>
  <div id="storybook-root"></div>
  <div id="storybook-docs"></div>
  <script>
    const params = new URLSearchParams(location.search);
    const id = params.get('id');
    const viewMode = params.get('viewMode');
    const listeners = {};
    window.__STORYBOOK_ADDONS_CHANNEL__ = {
      on(event, fn) { (listeners[event] ??= []).push(fn); },
      emit(event) { (listeners[event] ?? []).forEach((fn) => fn()); },
    };
    const lorem = (n) => Array.from({ length: n }, (_, i) => `<p>Paragraph ${i + 1}. Lorem ipsum dolor sit amet.</p>`).join('');
    const docs = {
      'intro--docs': `<h1>Intro</h1>
        <p><a id="to-button" href="?path=/docs/components-button--docs">Button docs</a>,
           <a id="to-missing" href="?path=/docs/internal-secret--docs">secret page</a>,
           <a href="https://example.com/">external</a></p>
        <div class="sb-print-only">print only</div>
        ${lorem(60)}
        <img loading="lazy" src="pixel.svg" width="40" height="40" alt="">`,
      'components-button--docs': `<h1>Button</h1><div class="sbdocs-preview"><div class="docs-story"><button>Primary</button></div></div>`,
      'foundations-tables--docs': `<h1>Tables</h1>
        <div id="scroll-x" style="overflow-x:auto"><table id="wide" style="white-space:nowrap;border-collapse:collapse">
          <tr>${Array.from({ length: 10 }, (_, i) => `<td style="padding:4px 10px">column-${i}-with-a-long-value</td>`).join('')}</tr>
        </table></div>
        <div id="scroll-y" style="max-height:80px;overflow-y:auto"><table>
          ${Array.from({ length: 30 }, (_, i) => `<tr><td>row ${i}</td></tr>`).join('')}
        </table></div>
        <div id="opt-out" class="sb-print-no-fit" style="max-height:40px;overflow-y:auto">${lorem(10)}</div>`,
      // React-style tabs (only the active panel is in the DOM, re-rendered
      // asynchronously on click) and Radix-style tabs (all panels in the DOM,
      // inactive ones `hidden`), plus a CSS mask icon.
      'foundations-tabs--docs': `<h1>Tabs</h1>
        <div id="react-tabs">
          <div role="tablist">
            <button role="tab" aria-selected="true" aria-controls="react-panel">Overview</button>
            <button role="tab" aria-selected="false" aria-controls="react-panel">Usage</button>
            <button role="tab" aria-selected="false" aria-controls="react-panel" disabled>Disabled</button>
          </div>
          <div role="tabpanel" id="react-panel"><p id="react-content">Content of Overview</p></div>
        </div>
        <div id="hidden-tabs">
          <div role="tablist">
            <button role="tab" aria-selected="true" aria-controls="do-panel">Do</button>
            <button role="tab" aria-selected="false" aria-controls="dont-panel">Don't</button>
          </div>
          <div role="tabpanel" id="do-panel"><p>Do content</p></div>
          <div role="tabpanel" id="dont-panel" hidden><p>Dont content</p></div>
        </div>
        <div id="kept-tabs" class="sb-print-no-fit">
          <div role="tablist">
            <button role="tab" aria-selected="true" aria-controls="kept-a">Kept A</button>
            <button role="tab" aria-selected="false" aria-controls="kept-b">Kept B</button>
          </div>
          <div role="tabpanel" id="kept-a"><p>Kept A content</p></div>
          <div role="tabpanel" id="kept-b" hidden><p>Kept B content</p></div>
        </div>
        <k-tabs id="shadow-tabs" labels='["Alpha","Beta","Gamma"]'></k-tabs>
        <k-slotted-tabs id="slotted-tabs">
          <div role="tabpanel" slot="panel" id="slotted-one"><p>Slotted One content</p></div>
          <div role="tabpanel" slot="panel" id="slotted-two" hidden><p>Slotted Two content</p></div>
        </k-slotted-tabs>
        <p><i id="mask-icon" style="display:inline-block;width:24px;height:24px;background-color:rgb(200, 0, 0);
          mask-image:url(data:image/svg+xml;base64,${btoa('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="currentColor"/></svg>')});
          mask-repeat:no-repeat;mask-size:contain"></i></p>`,
      // Stencil-like web components, defined only after the "rendered" event
      // (lazy loading / hydration): tab bar in x-tabs' shadow root, light-DOM
      // x-tab-panel hosts whose own shadow roots hold the hidden tabpanel and
      // a slot, a nested tab set and a disabled tab. Then a component that
      // renders only its active panel, with a shadow-DOM card in it.
      'foundations-web-components--docs': `<h1>Web Components</h1>
        <x-tabs id="outer-tabs">
          <x-tab-panel label="Install"><p>Outer install text</p></x-tab-panel>
          <x-tab-panel label="Usage">
            <p>Outer usage text</p>
            <x-tabs id="inner-tabs">
              <x-tab-panel label="React"><p>Inner react text</p></x-tab-panel>
              <x-tab-panel label="Vue"><p>Inner vue text</p></x-tab-panel>
            </x-tabs>
          </x-tab-panel>
          <x-tab-panel label="Legacy" disabled><p>Outer legacy text</p></x-tab-panel>
          <x-tab-panel label="API"><p>Outer api text</p></x-tab-panel>
        </x-tabs>
        <x-lazy-tabs id="lazy-tabs" labels='["Colors","Spacing","Motion"]'></x-lazy-tabs>
        <x-tabs id="kept-wc-tabs" class="sb-print-no-fit">
          <x-tab-panel label="Kept One"><p>Kept wc one text</p></x-tab-panel>
          <x-tab-panel label="Kept Two"><p>Kept wc two text</p></x-tab-panel>
        </x-tabs>`,
    };
    // Web component tabs: everything in the shadow DOM, inactive panels `hidden`
    // (the shadow style forces that with !important), plus a mask icon in there.
    const iconSvg = btoa('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/></svg>');
    customElements.define('k-tabs', class extends HTMLElement {
      connectedCallback() {
        if (this.shadowRoot) return;
        const labels = JSON.parse(this.getAttribute('labels'));
        const root = this.attachShadow({ mode: 'open' });
        root.innerHTML = `<style>[hidden] { display: none !important; } .panel { display: flex; }</style>
          <div role="tablist">${labels.map((l, i) => `<button role="tab" aria-selected="${i === 0}" aria-controls="p${i}">${l}</button>`).join('')}</div>
          ${labels.map((l, i) => `<div class="panel" role="tabpanel" id="p${i}" ${i ? 'hidden' : ''}><p>Shadow ${l} content</p></div>`).join('')}
          <i id="shadow-icon" style="display:inline-block;width:24px;height:24px;background-color:rgb(0, 0, 200);
            -webkit-mask-image:url(data:image/svg+xml;base64,${iconSvg});mask-image:url(data:image/svg+xml;base64,${iconSvg})"></i>`;
      }
    });
    // Tabs in the shadow DOM, panels in the light DOM, slotted in.
    customElements.define('k-slotted-tabs', class extends HTMLElement {
      connectedCallback() {
        if (this.shadowRoot) return;
        const root = this.attachShadow({ mode: 'open' });
        root.innerHTML = `<div role="tablist">
            <button role="tab" aria-selected="true">One</button>
            <button role="tab" aria-selected="false">Two</button>
          </div><slot name="panel"></slot>`;
      }
    });
    // Stencil-like components: defined late, render asynchronously (like
    // componentWillLoad), mark themselves `hydrated`. aria-controls point to
    // IDs that live in other shadow roots, so they don't resolve (the same IDs
    // repeat in the nested tab set).
    const tick = (ms) => new Promise((r) => setTimeout(r, ms));
    const defineWebComponents = () => {
      customElements.define('x-tabs', class extends HTMLElement {
        async connectedCallback() {
          if (this.shadowRoot) return;
          await tick(40);
          const panels = [...this.children].filter((c) => c.localName === 'x-tab-panel');
          const root = this.attachShadow({ mode: 'open' });
          root.innerHTML = `<style>:host { display: block; margin: 8px 0 } .bar { display: flex; gap: 4px }</style>
            <div class="bar" role="tablist">${panels.map((p, i) => `<button role="tab" aria-controls="panel-${i}"
              aria-selected="${i === 0}"${p.hasAttribute('disabled') ? ' disabled aria-disabled="true"' : ''}>${p.getAttribute('label')}</button>`).join('')}</div>
            <slot></slot>`;
          const select = (i) => {
            root.querySelectorAll('[role="tab"]').forEach((t, k) => t.setAttribute('aria-selected', String(k === i)));
            panels.forEach((p, k) => p.toggleAttribute('active', k === i));
          };
          root.addEventListener('click', (e) => {
            const tab = e.target.closest('[role="tab"]');
            if (tab && !tab.disabled) select([...root.querySelectorAll('[role="tab"]')].indexOf(tab));
          });
          select(0);
          this.classList.add('hydrated');
        }
      });
      customElements.define('x-tab-panel', class extends HTMLElement {
        static observedAttributes = ['active'];
        async connectedCallback() {
          if (this.shadowRoot) return;
          await tick(60);
          const root = this.attachShadow({ mode: 'open' });
          root.innerHTML = `<style>:host { display: block } :host(:not([active])) { display: none }
              [hidden] { display: none !important } .body { display: flex; flex-direction: column; padding: 4px; border: 1px solid #ddd }</style>
            <div class="body" role="tabpanel" id="panel"><slot></slot></div>`;
          this.attributeChangedCallback();
          this.classList.add('hydrated');
        }
        attributeChangedCallback() {
          this.shadowRoot?.querySelector('[role="tabpanel"]').toggleAttribute('hidden', !this.hasAttribute('active'));
        }
      });
      // Only the active panel is rendered, after a short delay.
      customElements.define('x-lazy-tabs', class extends HTMLElement {
        async connectedCallback() {
          if (this.shadowRoot) return;
          await tick(30);
          const labels = JSON.parse(this.getAttribute('labels'));
          const root = this.attachShadow({ mode: 'open' });
          root.innerHTML = `<div role="tablist">${labels.map((l, i) => `<button role="tab" aria-controls="lazy-panel" aria-selected="${i === 0}">${l}</button>`).join('')}</div>
            <div role="tabpanel" id="lazy-panel"></div>`;
          const render = (i) => {
            root.querySelectorAll('[role="tab"]').forEach((t, k) => t.setAttribute('aria-selected', String(k === i)));
            setTimeout(() => {
              root.getElementById('lazy-panel').innerHTML = `<x-card heading="${labels[i]}"><span>${labels[i]} slotted note</span></x-card>`;
            }, 60);
          };
          root.addEventListener('click', (e) => {
            const tab = e.target.closest('[role="tab"]');
            if (tab) render([...root.querySelectorAll('[role="tab"]')].indexOf(tab));
          });
          render(0);
          this.classList.add('hydrated');
        }
      });
      // Text only in the shadow root, plus slotted light-DOM content.
      customElements.define('x-card', class extends HTMLElement {
        async connectedCallback() {
          if (this.shadowRoot) return;
          await tick(20);
          this.attachShadow({ mode: 'open' }).innerHTML = `<style>.card { border: 1px solid #090; padding: 4px; color: rgb(0, 90, 0) }</style>
            <div class="card"><strong>Lazy ${this.getAttribute('heading')} card</strong> <slot></slot></div>`;
        }
      });
    };
    setTimeout(defineWebComponents, 700);
    // Tab behaviour of the two fixtures above.
    document.addEventListener('click', (event) => {
      const tab = event.target.closest('[role="tab"]');
      if (!tab || tab.disabled) return;
      const list = tab.closest('[role="tablist"]');
      for (const t of list.querySelectorAll('[role="tab"]')) t.setAttribute('aria-selected', String(t === tab));
      if (tab.closest('#react-tabs')) {
        setTimeout(() => {
          document.getElementById('react-panel').innerHTML = `<p id="react-content">Content of ${tab.textContent}</p>`;
        }, 50);
      } else {
        for (const t of list.querySelectorAll('[role="tab"]')) document.getElementById(t.getAttribute('aria-controls')).hidden = t !== tab;
      }
    });
    setTimeout(() => {
      document.body.classList.remove('sb-show-preparing-docs');
      if (id === 'components-broken--docs') {
        document.body.classList.add('sb-show-errordisplay');
        document.getElementById('error-message').textContent = 'Boom: component threw';
        return;
      }
      if (viewMode === 'docs') {
        document.body.classList.add('sb-show-main');
        document.getElementById('storybook-docs').innerHTML =
          `<div class="sbdocs sbdocs-wrapper"><div class="sbdocs sbdocs-content">${docs[id] ?? '<h1>Unknown</h1>'}</div></div>`;
        window.__STORYBOOK_ADDONS_CHANNEL__.emit('docsRendered');
      } else {
        document.body.classList.add('sb-show-main');
        document.getElementById('storybook-root').innerHTML = `<span class="story">${id}</span>`;
        window.__STORYBOOK_ADDONS_CHANNEL__.emit('storyRendered');
      }
    }, 30);
  </script>
</body>
</html>
