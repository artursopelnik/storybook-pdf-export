<!doctype html>
<!-- Minimal stand-in for a Storybook preview iframe: same body classes,
     same root elements, same channel events. Used by test/e2e.test.js. -->
<html>
<head><meta charset="utf-8"><title>fake storybook</title></head>
<body class="sb-show-preparing-docs">
  <div class="sb-errordisplay sb-wrapper"><div id="error-message"></div></div>
  <div id="storybook-root"></div>
  <div id="storybook-docs"></div>
  <script>
    const params = new URLSearchParams(location.search);
    const id = params.get('id');
    const viewMode = params.get('viewMode');
    const listeners = {};
    window.__STORYBOOK_ADDONS_CHANNEL__ = {
      on(event, fn) { (listeners[event] ??= []).push(fn); },
      emit(event) { (listeners[event] ?? []).forEach((fn) => fn()); },
    };
    const lorem = (n) => Array.from({ length: n }, (_, i) => `<p>Paragraph ${i + 1}. Lorem ipsum dolor sit amet.</p>`).join('');
    const docs = {
      'intro--docs': `<h1>Intro</h1>
        <p><a id="to-button" href="?path=/docs/components-button--docs">Button docs</a>,
           <a id="to-missing" href="?path=/docs/internal-secret--docs">secret page</a>,
           <a href="https://example.com/">external</a></p>
        <div class="sb-print-only">print only</div>
        ${lorem(60)}
        <img loading="lazy" src="pixel.svg" width="40" height="40" alt="">`,
      'components-button--docs': `<h1>Button</h1><div class="sbdocs-preview"><div class="docs-story"><button>Primary</button></div></div>`,
      'foundations-tables--docs': `<h1>Tables</h1>
        <div id="scroll-x" style="overflow-x:auto"><table id="wide" style="white-space:nowrap;border-collapse:collapse">
          <tr>${Array.from({ length: 10 }, (_, i) => `<td style="padding:4px 10px">column-${i}-with-a-long-value</td>`).join('')}</tr>
        </table></div>
        <div id="scroll-y" style="max-height:80px;overflow-y:auto"><table>
          ${Array.from({ length: 30 }, (_, i) => `<tr><td>row ${i}</td></tr>`).join('')}
        </table></div>
        <div id="opt-out" class="sb-print-no-fit" style="max-height:40px;overflow-y:auto">${lorem(10)}</div>`,
      // React-style tabs (only the active panel is in the DOM, re-rendered
      // asynchronously on click) and Radix-style tabs (all panels in the DOM,
      // inactive ones `hidden`), plus a CSS mask icon.
      'foundations-tabs--docs': `<h1>Tabs</h1>
        <div id="react-tabs">
          <div role="tablist">
            <button role="tab" aria-selected="true" aria-controls="react-panel">Overview</button>
            <button role="tab" aria-selected="false" aria-controls="react-panel">Usage</button>
            <button role="tab" aria-selected="false" aria-controls="react-panel" disabled>Disabled</button>
          </div>
          <div role="tabpanel" id="react-panel"><p id="react-content">Content of Overview</p></div>
        </div>
        <div id="hidden-tabs">
          <div role="tablist">
            <button role="tab" aria-selected="true" aria-controls="do-panel">Do</button>
            <button role="tab" aria-selected="false" aria-controls="dont-panel">Don't</button>
          </div>
          <div role="tabpanel" id="do-panel"><p>Do content</p></div>
          <div role="tabpanel" id="dont-panel" hidden><p>Dont content</p></div>
        </div>
        <div id="kept-tabs" class="sb-print-no-fit">
          <div role="tablist">
            <button role="tab" aria-selected="true" aria-controls="kept-a">Kept A</button>
            <button role="tab" aria-selected="false" aria-controls="kept-b">Kept B</button>
          </div>
          <div role="tabpanel" id="kept-a"><p>Kept A content</p></div>
          <div role="tabpanel" id="kept-b" hidden><p>Kept B content</p></div>
        </div>
        <p><i id="mask-icon" style="display:inline-block;width:24px;height:24px;background-color:rgb(200, 0, 0);
          mask-image:url(data:image/svg+xml;base64,${btoa('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="currentColor"/></svg>')});
          mask-repeat:no-repeat;mask-size:contain"></i></p>`,
    };
    // Tab behaviour of the two fixtures above.
    document.addEventListener('click', (event) => {
      const tab = event.target.closest('[role="tab"]');
      if (!tab || tab.disabled) return;
      const list = tab.closest('[role="tablist"]');
      for (const t of list.querySelectorAll('[role="tab"]')) t.setAttribute('aria-selected', String(t === tab));
      if (tab.closest('#react-tabs')) {
        setTimeout(() => {
          document.getElementById('react-panel').innerHTML = `<p id="react-content">Content of ${tab.textContent}</p>`;
        }, 50);
      } else {
        for (const t of list.querySelectorAll('[role="tab"]')) document.getElementById(t.getAttribute('aria-controls')).hidden = t !== tab;
      }
    });
    setTimeout(() => {
      document.body.classList.remove('sb-show-preparing-docs');
      if (id === 'components-broken--docs') {
        document.body.classList.add('sb-show-errordisplay');
        document.getElementById('error-message').textContent = 'Boom: component threw';
        return;
      }
      if (viewMode === 'docs') {
        document.body.classList.add('sb-show-main');
        document.getElementById('storybook-docs').innerHTML =
          `<div class="sbdocs sbdocs-wrapper"><div class="sbdocs sbdocs-content">${docs[id] ?? '<h1>Unknown</h1>'}</div></div>`;
        window.__STORYBOOK_ADDONS_CHANNEL__.emit('docsRendered');
      } else {
        document.body.classList.add('sb-show-main');
        document.getElementById('storybook-root').innerHTML = `<span class="story">${id}</span>`;
        window.__STORYBOOK_ADDONS_CHANNEL__.emit('storyRendered');
      }
    }, 30);
  </script>
</body>
</html>
